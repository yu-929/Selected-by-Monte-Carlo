name: Merge scan results to ipchi.txt

on:
  push:
    paths:
      - 'check/history/*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge and deduplicate by IP:port
        run: |
          shopt -s nullglob
          files=(check/history/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No history files to merge, skipping"
            exit 0
          fi
          awk 'NF {split($1,a,"#"); key=a[1]; if(!seen[key]++) print}' check/ipchi.txt "${files[@]}" > check/ipchi.tmp && mv check/ipchi.tmp check/ipchi.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/ipchi.txt
          git diff --cached --quiet || git commit -m "chore: merge scan results to ipchi.txt"
          git push