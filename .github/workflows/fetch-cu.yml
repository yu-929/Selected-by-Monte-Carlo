name: Fetch cu source

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert merged_ips.csv
        run: |
          curl -sL --max-time 30 "https://raw.githubusercontent.com/e13815332/subyd/refs/heads/main/data/merged_ips.csv" \
            | tail -n +2 \
            | awk -F',' '{print $1":"$2"#"$5}' \
            > cu.txt

      - name: Commit and push if changed
        run: |
          if [ -f cu.txt ] && [ -s cu.txt ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add cu.txt
            git diff --cached --quiet || git commit -m "chore: 同步 cu 源数据 (6h)"
            git push
          fi