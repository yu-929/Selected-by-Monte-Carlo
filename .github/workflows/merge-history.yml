name: Merge IP sources to history

on:
  push:
    paths:
      - 'ip.txt'
      - 'ip-2.txt'
      - 'ip-3.txt'
      - 'ip-4.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge and deduplicate all IP sources
        run: |
          sort -u -t: -k1,2 ip.txt ip-2.txt ip-3.txt ip-4.txt history.txt 2>/dev/null | grep -v '^$' > history_merged.txt
          mv history_merged.txt history.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add history.txt
          git diff --cached --quiet || git commit -m "chore: 合并 IP 数据源到 history.txt"
          git push