name: Check Proxy IPs

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test IPs and save valid ones
        run: |
          while IFS= read -r line; do
            ip_port=$(echo "$line" | cut -d'#' -f1)
            [ -z "$ip_port" ] && continue
            result=$(curl -s --max-time 15 "https://api.090227.xyz/check?proxyip=${ip_port}" 2>/dev/null)
            success=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))" 2>/dev/null)
            if [ "$success" = "True" ]; then
              echo "$line" >> proxy.txt
            fi
          done < ip.txt

      - name: Commit and push if changed
        run: |
          if [ -f proxy.txt ] && [ -s proxy.txt ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add proxy.txt
            git diff --cached --quiet || git commit -m "chore: 更新可用代理列表 (12h)"
            git push
          else
            echo "No valid proxies found"
          fi