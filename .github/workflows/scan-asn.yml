name: Scan ASN / CIDR for CF proxy IPs

on:
  workflow_dispatch:
    inputs:
      scan_input:
        description: '目标列表'
        required: true
      scan_ports:
        description: '端口列表'
        required: false
        default: '443'
      smart_tiering:
        description: 'Smart Tiering 预筛（关闭则全量扫描）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: scan-asn
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skip if not workflow_dispatch
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipped: only workflow_dispatch is supported"
            exit 0
          fi

      - name: Install dependencies
        run: pip install -r check/requirements.txt

      - name: Run scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          SMART_TIERING: ${{ github.event.inputs.smart_tiering }}
        run: |
          python check/check_cf_asn.py "${{ github.event.inputs.scan_input }}" "${{ github.event.inputs.scan_ports }}" 2>&1 | tee /tmp/scan.log
          output_file=$(grep '结果:' /tmp/scan.log | tail -1 | grep -oP '结果: \K[^ ]+\.txt' || echo "")
          echo "SCAN_OUTPUT=$output_file" >> $GITHUB_ENV

      - name: Merge into ipchi.txt
        run: |
          src="${SCAN_OUTPUT}"
          [ -f "$src" ] || src="check/history/${SCAN_OUTPUT}"
          [ -f "$src" ] || { echo "Output file not found, skipping merge"; exit 0; }
          awk 'NF {split($1,a,"#"); key=a[1]; if(!seen[key]++) print}' check/ipchi.txt "$src" > check/ipchi.tmp && mv check/ipchi.tmp check/ipchi.txt
          echo "Merged $(wc -l < "$src") lines into ipchi.txt"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/history/ check/ipchi.txt
          git diff --cached --quiet || git commit -m "chore: 扫描结果"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done