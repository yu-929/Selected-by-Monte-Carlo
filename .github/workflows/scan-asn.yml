name: Scan ASN / CIDR for CF proxy IPs

on:
  workflow_dispatch:
    inputs:
      scan_input:
        description: '目标列表：ASN (如 AS206300) / CIDR (如 154.17.0.0/24) / IP 混合，逗号分隔，或文件路径 (如 check/targets.txt)'
        required: true
        default: 'AS206300'
      scan_ports:
        description: '端口列表，逗号分隔 (默认 443)'
        required: false
        default: '443'

permissions:
  contents: write

concurrency:
  group: scan-asn
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skip if not workflow_dispatch
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipped: only workflow_dispatch is supported"
            exit 0
          fi

      - name: Install dependencies
        run: pip install -r check/requirements.txt

      - name: Run scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          python check/check_cf_asn.py "${{ github.event.inputs.scan_input }}" "${{ github.event.inputs.scan_ports }}" 2>&1 | tee /tmp/scan.log
          output_file=$(grep '保存至' /tmp/scan.log | tail -1 | grep -oP '保存至：\K[^ )]+\.txt' || echo "")
          echo "SCAN_OUTPUT=$output_file" >> $GITHUB_ENV

      - name: Validate IPs via API
        run: |
          src="${SCAN_OUTPUT}"
          [ -f "$src" ] || src="check/history/${SCAN_OUTPUT}"
          [ -f "$src" ] || src="check/${SCAN_OUTPUT}"
          [ ! -f "$src" ] && echo "No output file found" && exit 0
          base=$(basename "$src" .txt)
          out="check/history/${base}_valid.txt"
          rm -f "$out"
          python3 check/validate.py "$src" "$out"
          echo "Valid: $(wc -l < "$out" 2>/dev/null || echo 0)"

      - name: Merge valid into ipchi.txt
        run: |
          cat check/ipchi.txt 2>/dev/null check/history/*_valid.txt 2>/dev/null | grep -vh '#timeout' | sort -u -t: -k1,2 > check/ipchi.tmp && mv check/ipchi.tmp check/ipchi.txt

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/
          git diff --cached --quiet || git commit -m "chore: 扫描结果"
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && break
            sleep 5
          done