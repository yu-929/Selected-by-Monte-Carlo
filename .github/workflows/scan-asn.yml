name: Scan ASN for CF proxy IPs

on:
  workflow_dispatch:
    inputs:
      asn_input:
        description: 'ASN 号 (如 AS206300, AS906, 或 13335)'
        required: true
        default: 'AS206300'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skip if not workflow_dispatch
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipped: only workflow_dispatch is supported"
            exit 0
          fi

      - name: Install dependencies
        run: pip install -r check/requirements.txt

      - name: Run ASN scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: python check/check_cf_asn.py "${{ github.event.inputs.asn_input }}"

      - name: Move result to check/
        run: |
          asn=$(echo "${{ github.event.inputs.asn_input }}" | sed 's/^AS//i' | tr 'a-z' 'A-Z')
          echo "ASN=${asn}" >> $GITHUB_ENV
          src="AS${asn}.txt"
          [ -f "$src" ] && mv "$src" "check/$src" || true

      - name: Validate IPs via API
        run: |
          rm -f check/AS${ASN}_valid.txt
          python3 check/validate.py check/AS${ASN}.txt check/AS${ASN}_valid.txt
          echo "Valid: $(wc -l < check/AS${ASN}_valid.txt 2>/dev/null || echo 0)"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/
          git diff --cached --quiet || git commit -m "chore: 扫描 AS${ASN} 结果"
          git push