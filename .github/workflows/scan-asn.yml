name: Scan ASN for CF proxy IPs

on:
  workflow_dispatch:
    inputs:
      asn_input:
        description: 'ASN 号 (如 AS206300, AS906, 或 13335)'
        required: true
        default: 'AS206300'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r check/requirements.txt

      - name: Run ASN scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: python check/check_cf_asn.py "${{ github.event.inputs.asn_input }}"

      - name: Move result to check/
        run: |
          asn=$(echo "${{ github.event.inputs.asn_input }}" | sed 's/^AS//i' | tr 'a-z' 'A-Z')
          echo "ASN=${asn}" >> $GITHUB_ENV
          src="AS${asn}.txt"
          [ -f "$src" ] && mv "$src" "check/$src" || true

      - name: Validate IPs via API
        run: |
          src="check/AS${ASN}.txt"
          out="check/AS${ASN}_valid.txt"
          [ ! -f "$src" ] && exit 0
          total=$(wc -l < "$src")
          count=0
          while IFS= read -r ip; do
            [ -z "$ip" ] && continue
            count=$((count + 1))
            echo "[$count/$total] Checking $ip ..."
            resp=$(curl -s --max-time 15 "https://api.090227.xyz/check?proxyip=${ip}:443")
            ok=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',False))" 2>/dev/null)
            if [ "$ok" = "True" ]; then
              exit_data=$(echo "$resp" | python3 -c "
import sys, json
d = json.load(sys.stdin)['exit']
country = d.get('country','')
city = d.get('city','')
asn = d.get('asn','')
org = d.get('asOrganization','')
print(f'{d[\"country\"]} {d.get(\"city\",\"\")} AS{asn} {org}')
" 2>/dev/null)
              echo "${ip}:443#${exit_data}" >> "$out"
            fi
          done < "$src"
          echo "Valid: $(wc -l < "$out" 2>/dev/null || echo 0)"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/
          git diff --cached --quiet || git commit -m "chore: 扫描 AS${ASN} 结果"
          git push