name: Scan ASN / CIDR for CF proxy IPs

on:
  workflow_dispatch:
    inputs:
      scan_input:
        description: 'ASN 号 (如 AS206300) 或 CIDR 网段 (如 154.17.0.0/24,103.0.0.0/24) 或 CIDR 文件路径 (如 check/targets.txt)'
        required: true
        default: 'AS206300'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skip if not workflow_dispatch
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipped: only workflow_dispatch is supported"
            exit 0
          fi

      - name: Install dependencies
        run: pip install -r check/requirements.txt

      - name: Run scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
        run: |
          python check/check_cf_asn.py "${{ github.event.inputs.scan_input }}" 2>&1 | tee /tmp/scan.log
          output_file=$(tail -1 /tmp/scan.log | grep -oP '保存至：\K(.+\.txt)' || echo "")
          echo "SCAN_OUTPUT=$output_file" >> $GITHUB_ENV

      - name: Validate IPs via API
        run: |
          src="check/${SCAN_OUTPUT}"
          [ ! -f "$src" ] && src="${SCAN_OUTPUT}"
          [ ! -f "$src" ] && echo "No output file found" && exit 0
          base=$(basename "$src" .txt)
          out="check/${base}_valid.txt"
          rm -f "$out"
          python3 check/validate.py "$src" "$out"
          echo "Valid: $(wc -l < "$out" 2>/dev/null || echo 0)"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add check/
          git diff --cached --quiet || git commit -m "chore: 扫描结果"
          git push