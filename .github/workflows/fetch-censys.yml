name: Fetch Censys Cloudflare IPs

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cloudflare proxy IPs from Censys
        env:
          CENSYS_KEY: ${{ secrets.CENSYS_KEY }}
        run: |
          if [ -z "$CENSYS_KEY" ]; then
            echo "No CENSYS_KEY secret configured, skipping"
            exit 0
          fi

          query="NOT autonomous_system.asn={13335,209242} and services.software.vendor=CloudFlare"
          encoded=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$query'))")

          for page in $(seq 1 10); do
            echo "Fetching page $page..."
            resp=$(curl -s --max-time 30 \
              "https://search.censys.io/api/v2/hosts/search?per_page=100&virtual_hosts=EXCLUDE&sort=RELEVANCE&q=$encoded&page=$page" \
              -H "Accept: application/json" \
              -H "Authorization: Basic $CENSYS_KEY")

            echo "$resp" | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    for hit in data.get('result', {}).get('hits', []):
        ip = hit.get('ip', '')
        for svc in hit.get('services', []):
            if svc.get('service_name') == 'HTTP':
                port = svc.get('port', 443)
                print(f'{ip}:{port}')
except: pass
" >> ip-censys.txt
          done

          sort -u -t: -k1,2 ip-censys.txt -o ip-censys.txt

      - name: Commit and push if changed
        run: |
          if [ -f ip-censys.txt ] && [ -s ip-censys.txt ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add ip-censys.txt
            git diff --cached --quiet || git commit -m "chore: 同步 Censys 源数据 (12h)"
            git push
          fi