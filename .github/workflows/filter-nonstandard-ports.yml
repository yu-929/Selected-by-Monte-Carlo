name: Filter Non-Standard Port IPs

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "目标文件路径（如 ip-4.txt）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter non-standard ports
        env:
          INPUT_FILE: "${{ inputs.file_path }}"
        run: |
          mkdir -p 非标
          base="${INPUT_FILE%.*}"
          ext="${INPUT_FILE##*.}"
          if [ -n "$ext" ] && [ "$ext" != "$INPUT_FILE" ]; then
            OUTPUT_FILE="${base}-非标.${ext}"
          else
            OUTPUT_FILE="${INPUT_FILE}-非标"
          fi
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> "$GITHUB_ENV"
          awk -F '[:#]' '
            BEGIN {
              exclude["80"]=1; exclude["8080"]=1; exclude["8880"]=1
              exclude["2052"]=1; exclude["2082"]=1; exclude["2086"]=1
              exclude["443"]=1; exclude["2053"]=1; exclude["2083"]=1
              exclude["2087"]=1; exclude["8443"]=1
            }
            !($2 in exclude) { print }
          ' "${{ inputs.file_path }}" > "非标/$OUTPUT_FILE"

      - name: Show summary
        run: |
          total=$(wc -l < "${{ inputs.file_path }}")
          filtered=$(wc -l < "非标/$OUTPUT_FILE")
          echo "Total: $total, Non-standard: $filtered, Output: 非标/$OUTPUT_FILE"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "非标/$OUTPUT_FILE"
          git commit -m "chore: 筛选非标端口 ${INPUT_FILE} -> ${OUTPUT_FILE}"
          git push
        env:
          INPUT_FILE: "${{ inputs.file_path }}"
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}